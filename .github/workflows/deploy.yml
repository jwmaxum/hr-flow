# Verification only. Cloudflare Pages deploys jwmaxum/hr-flow through its Git integration.
name: Verify HR Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Client unit tests
        run: npm run test:unit

      - name: Administrator, payment and route-loading regressions
        working-directory: .
        run: node --test scripts/tests/admin-ui-security.test.cjs scripts/tests/payment-security.test.cjs scripts/tests/loading-navigation-security.test.cjs

      - name: Production build and TypeScript check
        run: npm run build
        env:
          CI: true
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}

      - name: Verify test bootstrap is absent from production
        working-directory: .
        run: npm run test:e2e:boundary

  browser-e2e:
    name: Isolated login and attachment checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-desktop, chromium-mobile]
    env:
      HR_FLOW_E2E_BROWSER_PROJECT: ${{ matrix.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test, client and function dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix client ci
          npm --prefix functions ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check emulator safety guards
        run: npm run test:e2e:safety

      - name: Test desktop and mobile against isolated Firebase emulators
        run: npm run test:e2e

      - name: Save safe test summary and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-browser-e2e-${{ matrix.browser }}
          path: |
            test-results/e2e/results.json
            test-results/e2e/erp-usability-*.json
            test-results/e2e/artifacts/**/*.png
          if-no-files-found: ignore
          retention-days: 7
